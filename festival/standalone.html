<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Kingdom Story Festival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,100;1,9..144,300..700,100&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a storybook-meets-wayfinding site. Warm ivory pages, black ink for contrast, restrained gold for moments of emphasis,
   and seven distinct world colors used only as small identity marks (never as the brand). One scenic hero; everything else stays calm. */
:root{
  --bg:#FBF7EE; --bg2:#F3ECDD; --surface:#FFFFFF; --ink:#18140E; --ink2:#5A5246; --line:#E3D9C4;
  --gold:#C9A24D; --gold-deep:#80610F; --gold-soft:#F4E8C3; --on-gold:#18140E; --focus:#0F5FD6;
  --sky-a:#FFF8E6; --sky-b:#F9E2B4; --hill-a:#E9D9AE; --hill-b:#D4C08A; --hill-c:#B9A56F; --book:#FFFDF6; --glow:#FFE9A8;
  --w-faith:#4E8A5B; --w-family:#E0694F; --w-edu:#3A82C4; --w-biz:#D3991A; --w-gov:#2C4573; --w-media:#1B8A84; --w-arts:#B5334E;
  --ok:#2E7D4F; --warn:#9A5B00; --demo:#0F5FD6;
  --f-display:'Fraunces','Iowan Old Style','Georgia',serif; --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 28px rgba(60,40,10,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14110C; --bg2:#1C1812; --surface:#231E16; --ink:#F6EFDF; --ink2:#BDB29E; --line:#3A3326;
  --gold:#D9B35F; --gold-deep:#E6C57A; --gold-soft:#3A2F14; --focus:#8CB8FF;
  --sky-a:#1E1A2A; --sky-b:#3B2C25; --hill-a:#2D2419; --hill-b:#241D14; --hill-c:#1A150F; --book:#F6EAC8; --glow:#7A5E24;
  --w-faith:#7DBA89; --w-family:#F08C74; --w-edu:#6FAEE6; --w-biz:#E8B84A; --w-gov:#8FA9E0; --w-media:#4CC0B8; --w-arts:#E27088;
  --ok:#6CC38F; --warn:#E8B25A; --demo:#8CB8FF; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110C; --bg2:#1C1812; --surface:#231E16; --ink:#F6EFDF; --ink2:#BDB29E; --line:#3A3326;
  --gold:#D9B35F; --gold-deep:#E6C57A; --gold-soft:#3A2F14; --focus:#8CB8FF;
  --sky-a:#1E1A2A; --sky-b:#3B2C25; --hill-a:#2D2419; --hill-b:#241D14; --hill-c:#1A150F; --book:#F6EAC8; --glow:#7A5E24;
  --w-faith:#7DBA89; --w-family:#F08C74; --w-edu:#6FAEE6; --w-biz:#E8B84A; --w-gov:#8FA9E0; --w-media:#4CC0B8; --w-arts:#E27088;
  --ok:#6CC38F; --warn:#E8B25A; --demo:#8CB8FF; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);font-variation-settings:"SOFT" 100;font-weight:500;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.5rem,6.4vw,4.6rem);font-weight:450}
h2{font-size:clamp(1.9rem,4vw,2.9rem)}
h3{font-size:1.45rem}
h4{font-size:1.15rem}
p{margin:0}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto}
.narrow{max-width:720px}
.eyebrow{font:600 .78rem/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep)}
.lede{font-size:1.2rem;color:var(--ink2);max-width:58ch}
.muted{color:var(--ink2)}
.small{font-size:.9rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:100}
.skip:focus{left:16px}

/* preview bar */
.pv{background:var(--ink);color:var(--bg);font-size:.86rem;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.pv .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.pv b{font-weight:700;color:var(--gold)}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:var(--bg);border:0;font:600 .82rem var(--f-body);padding:8px 14px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#18140E}
:root[data-theme="dark"] .pv,:root:not([data-theme="light"]) .pv{--pvbg:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pv{background:#0c0a07;color:#F6EFDF}.seg button{color:#F6EFDF}}
:root[data-theme="dark"] .pv{background:#0c0a07;color:#F6EFDF}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.hdr .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{font:500 1.2rem var(--f-display);font-variation-settings:"SOFT" 100;text-decoration:none;display:flex;gap:10px;align-items:center;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{padding:10px 12px;text-decoration:none;font-weight:500;font-size:.95rem;border-radius:999px;min-height:44px;display:inline-flex;align-items:center}
.nav a:hover{background:var(--bg2)}
.nav a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--gold)}
.menu-btn{display:none;margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;min-height:44px;padding:0 16px;font:600 .95rem var(--f-body);cursor:pointer}
@media(max-width:900px){
  .menu-btn{display:inline-flex;align-items:center}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;background:var(--bg);padding:12px 16px 18px;border-bottom:1px solid var(--line);margin:0}
  .nav.open{display:flex}
  .nav a{padding:12px 14px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border-radius:999px;border:1.5px solid transparent;
  font:600 1rem var(--f-body);text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;text-align:center}
.btn-gold{background:var(--gold);color:var(--on-gold);box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 40%,transparent)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 10px 24px color-mix(in srgb,var(--gold) 50%,transparent)}
.btn-line{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-line:hover{background:var(--ink);color:var(--bg)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-sm{min-height:44px;padding:8px 18px;font-size:.95rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.tlink{font-weight:600;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

/* sections */
section.s{padding-block:clamp(56px,9vw,104px)}
section.alt{background:var(--bg2);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.sh{display:grid;gap:14px;margin-bottom:clamp(28px,5vw,52px)}
.sh.center{text-align:center;justify-items:center}

/* hero */
.hero{position:relative;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,var(--sky-a),var(--sky-b));overflow:hidden;padding-block:clamp(40px,7vw,80px) 0}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center}
.hero-copy{display:grid;gap:22px;padding-bottom:clamp(40px,7vw,90px);position:relative;z-index:2;min-width:0}
.hero-copy .promise{font:italic 400 clamp(1.4rem,3vw,2rem)/1.2 var(--f-display);font-variation-settings:"SOFT" 100;color:var(--gold-deep)}
.tba{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:.95rem;color:var(--ink2)}
.tba i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.hero-art{position:relative;z-index:2;align-self:end;min-width:0}
.hero-art svg{display:block;width:100%;height:auto;max-width:100%}
.hills{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:1;pointer-events:none}
.hills svg{width:100%;height:100%;display:block}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero-art{max-width:520px;margin:0 auto}}
.orb{animation:float 7s ease-in-out infinite}
.orb:nth-child(2n){animation-duration:9s;animation-delay:-3s}.orb:nth-child(3n){animation-duration:8s;animation-delay:-5s}
@keyframes float{50%{transform:translateY(-10px)}}
.flag{transform-origin:top center;animation:sway 5s ease-in-out infinite}
.flag:nth-child(2n){animation-delay:-2s}.flag:nth-child(3n){animation-delay:-3.4s}
@keyframes sway{50%{transform:rotate(3deg)}}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
.hero-copy>*{animation:rise .8s both}.hero-copy>*:nth-child(2){animation-delay:.1s}.hero-copy>*:nth-child(3){animation-delay:.2s}.hero-copy>*:nth-child(4){animation-delay:.3s}.hero-copy>*:nth-child(5){animation-delay:.4s}

/* glimpse */
.glimpse{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,3vw,32px)}
.glimpse article{display:grid;gap:10px;align-content:start;padding-top:18px;border-top:2px solid var(--gold)}
.glimpse h3{font-size:1.35rem}
.scene{margin-top:clamp(28px,5vw,52px);padding:clamp(20px,4vw,34px);border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px}
.scene q{font:italic 400 clamp(1.25rem,2.6vw,1.7rem)/1.35 var(--f-display);font-variation-settings:"SOFT" 100;quotes:none}
.tag{display:inline-flex;align-items:center;gap:6px;font:600 .72rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--gold-soft);color:var(--ink);width:fit-content}
.tag.demo{background:color-mix(in srgb,var(--demo) 14%,var(--surface));border:1px solid var(--demo)}
.tag.todo{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1px solid var(--warn)}
@media(max-width:900px){.glimpse{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.glimpse{grid-template-columns:1fr}}

/* worlds */
.view-toggle{display:flex;gap:8px;margin-bottom:22px}
.view-toggle button{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem var(--f-body);cursor:pointer}
.view-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.map{position:relative;background:linear-gradient(180deg,var(--sky-a),var(--sky-b));border-radius:28px;border:1px solid var(--line);aspect-ratio:1000/520;overflow:hidden}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--ink);padding:4px;font:inherit;width:clamp(86px,14%,150px)}
.node .dot{width:clamp(44px,5.6vw,66px);aspect-ratio:1;border-radius:50%;background:var(--surface);border:3px solid var(--w);display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--w) 35%,transparent);transition:transform .2s}
.node:hover .dot,.node:focus-visible .dot{transform:scale(1.1)}
.node svg{width:55%;height:55%;stroke:var(--w);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.node .nm{font:600 clamp(.72rem,1.2vw,.9rem)/1.2 var(--f-body);background:color-mix(in srgb,var(--surface) 90%,transparent);padding:3px 8px;border-radius:8px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.wcard{--w:var(--w-faith);text-align:left;display:grid;gap:10px;align-content:start;padding:22px;border-radius:20px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--w);cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--shadow);transition:transform .18s}
.wcard:hover{transform:translateY(-3px)}
.wcard .ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--w) 16%,var(--surface));display:grid;place-items:center}
.wcard svg,.dlg-ic svg{width:26px;height:26px;stroke:var(--w);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wcard .pillar{font:600 .74rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.wcard h3{font-size:1.3rem}
.wcard .more{font-weight:600;font-size:.92rem;color:var(--ink);text-decoration:underline;text-decoration-color:var(--w);text-decoration-thickness:2px;text-underline-offset:4px}
.note{font-size:.92rem;color:var(--ink2);max-width:75ch;margin-top:22px}
.map-wrap[hidden],.cards-wrap[hidden]{display:none}
@media(max-width:720px){.view-toggle{display:none}}

dialog{border:0;padding:0;border-radius:24px;max-width:min(680px,calc(100vw - 24px));width:100%;background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4);max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(20,15,8,.6)}
.dlg-top{padding:26px 28px 20px;border-top:8px solid var(--w);display:grid;gap:10px;background:color-mix(in srgb,var(--w) 10%,var(--bg))}
.dlg-ic{width:48px;height:48px;border-radius:14px;background:var(--surface);display:grid;place-items:center;border:2px solid var(--w)}
.dlg-body{padding:6px 28px 28px;display:grid;gap:18px;overflow:auto}
.dlg-body h4{font-family:var(--f-body);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-bottom:6px}
.dlg-body ul{margin:0;padding-left:1.15rem;display:grid;gap:4px}
.dlg-x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;cursor:pointer}
.dlg-scene{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-style:italic}

/* signature */
.sig{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.sig article{grid-column:span 2;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;display:grid;gap:12px;align-content:start}
.sig article.big{grid-column:span 3}
.sig .num-ic{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center}
.sig .num-ic svg{width:22px;height:22px;stroke:var(--gold-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:900px){.sig{grid-template-columns:1fr 1fr}.sig article,.sig article.big{grid-column:span 1}}
@media(max-width:600px){.sig{grid-template-columns:1fr}}
.pass{margin-top:22px;padding:24px;border-radius:22px;background:var(--surface);border:1.5px dashed var(--gold);display:grid;gap:16px}
.stamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px}
.stamp{--w:var(--w-faith);display:grid;justify-items:center;gap:6px;padding:10px 4px;min-height:92px;background:transparent;border:0;color:var(--ink);font:600 .74rem/1.2 var(--f-body);cursor:pointer;text-align:center}
.stamp span.ring{width:56px;height:56px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;transition:all .25s}
.stamp svg{width:26px;height:26px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.stamp[aria-pressed="true"] span.ring{border:3px solid var(--w);background:color-mix(in srgb,var(--w) 18%,var(--surface));transform:rotate(-8deg)}
.stamp[aria-pressed="true"] svg{stroke:var(--w);opacity:1}

/* adventure */
.adv{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.adv a{display:grid;gap:10px;align-content:space-between;padding:22px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-decoration:none;min-height:220px;transition:transform .18s,border-color .18s}
.adv a:hover{transform:translateY(-3px);border-color:var(--gold)}
.adv h3{font-size:1.4rem}
.adv .go{font-weight:600;font-size:.92rem}
.adv .go::after{content:" →"}
.adv a.first{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.adv a.first .muted{color:color-mix(in srgb,var(--bg) 78%,transparent)}
@media(max-width:1000px){.adv{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.adv{grid-template-columns:1fr}.adv a{min-height:0}}

/* schedule */
.sched{list-style:none;margin:0;padding:0;display:grid;gap:0;max-width:820px}
.sched li{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:18px 0;border-top:1px solid var(--line)}
.sched li:last-child{border-bottom:1px solid var(--line)}
.sched time{font:600 .95rem var(--f-body);color:var(--gold-deep);font-variant-numeric:tabular-nums}
.sched h4{font-family:var(--f-display);font-weight:500;font-size:1.25rem;margin-bottom:4px}
.sched .kind{font:600 .72rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.sched li.brk{opacity:.85}
@media(max-width:520px){.sched li{grid-template-columns:1fr;gap:4px}}

/* tickets / forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,48px);align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.two>*,.split>*,.sig>*{min-width:0}
form{display:grid;gap:18px}
.f{display:grid;gap:6px;min-width:0}
.f label,.f legend{font-weight:600;font-size:.97rem}
.f .hint{font-size:.88rem;color:var(--ink2)}
.f .req{color:var(--gold-deep);font-weight:700}
input[type=text],input[type=email],input[type=url],input[type=number],select,textarea{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:400 1rem var(--f-body)}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:#C0392B}
.err{color:#B3261E;font-weight:600;font-size:.9rem}
:root[data-theme="dark"] .err{color:#FF8E86}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FF8E86}}
fieldset{border:0;padding:0;margin:0;min-width:0;display:grid;gap:8px}
.checks{display:grid;gap:4px}
.check{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:8px 0;cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--gold-deep);flex:none}
.check span{min-width:0}
.checks.cols{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 18px}
.status{padding:14px 16px;border-radius:12px;border:1.5px solid var(--demo);background:color-mix(in srgb,var(--demo) 10%,var(--surface));font-size:.95rem}
.status.bad{border-color:#C0392B;background:color-mix(in srgb,#C0392B 10%,var(--surface))}

/* faq */

/* final */

/* ============================================================

};

const WORLDS = [
 { id:'faith', col:'--w-faith', pillar:'Faith', name:'The Testimony Garden',

   books:['Devotionals','Christian living','Prayer guides','Memoir and testimony'],

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const money = n => '$' + n.toFixed(2);
const announce = t => { const l = $('#live'); l.textContent = ''; setTimeout(() => l.textContent = t, 40); };
const ctaLabel = () => CONFIG.status === 'launch-list' ? 'Join the Launch List' : 'Get Tickets';
const demoTag = t => `<span class="tag demo">Demo · ${esc(t)}</span>`;

function field({ id, label, type='text', req=false, hint='', opts=null, ac='', rows=0, value='' }) {
  const d = [hint ? id+'-h' : '', id+'-e'].filter(Boolean).join(' ');
  let ctl;
  if (opts) ctl = `<select id="${id}" name="${id}" ${req?'required':''} aria-describedby="${d}">${opts.map(o => `<option value="${esc(o[0])}" ${o[0]===value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if (rows) ctl = `<textarea id="${id}" name="${id}" rows="${rows}" ${req?'required':''} aria-describedby="${d}">${esc(value)}</textarea>`;
  else ctl = `<input id="${id}" name="${id}" type="${type}" ${ac?`autocomplete="${ac}"`:''} ${req?'required':''} aria-describedby="${d}" value="${esc(value)}">`;
  return `<div class="f"><label for="${id}">${esc(label)} ${req?'<span class="req" aria-hidden="true">*</span><span class="skip" style="position:absolute;left:-9999px">(required)</span>':'<span class="muted small">(optional)</span>'}</label>
    ${hint?`<div class="hint" id="${id}-h">${esc(hint)}</div>`:''}${ctl}<div class="err" id="${id}-e" hidden></div></div>`;
}
const check = (id, html, checked=false) => `<label class="check"><input type="checkbox" id="${id}" name="${id}" ${checked?'checked':''}><span>${html}</span></label>`;

function bindForm(formId, rules, onValid) {
  const form = $('#'+formId); if (!form) return;
  form.setAttribute('novalidate','');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const errs = [];
    $$('.err', form).forEach(x => { x.hidden = true; x.textContent = ''; });
    $$('[aria-invalid]', form).forEach(x => x.removeAttribute('aria-invalid'));
    for (const [id, r] of Object.entries(rules)) {
      const el = $('#'+id, form); if (!el) continue;
      const v = (el.value || '').trim(); let m = '';
      if (r.req && !v) m = 'This field is required.';
      else if (v && r.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) m = 'Enter a valid email, like name@example.com.';
      else if (v && r.url && !/^https?:\/\/.+\..+/i.test(v)) m = 'Enter a full web address starting with https://';
      else if (v && r.min && v.length < r.min) m = `Please write at least ${r.min} characters.`;
      if (m) { errs.push(id); el.setAttribute('aria-invalid','true'); const er = $('#'+id+'-e'); er.textContent = m; er.hidden = false; }
    }
    if (form.dataset.group) { // at least one checkbox in group
      const g = $$(`input[name="${form.dataset.group}"]`, form);
      if (g.length && !g.some(c => c.checked)) { errs.push('grp'); const er = $('#grp-e'); er.textContent = 'Choose at least one option.'; er.hidden = false; }
    }
    const st = $('#'+formId+'-st');
    if (errs.length) {
      st.className = 'status bad'; st.hidden = false;
      st.textContent = `Please fix ${errs.length} ${errs.length>1?'fields':'field'} before submitting.`;
      const first = errs[0]==='grp' ? $$('input[name="'+form.dataset.group+'"]',form)[0] : $('#'+errs[0], form); first && first.focus();
      return;
    }
    st.hidden = true;
    onValid(Object.fromEntries(new FormData(form).entries()), form);
  });
}
const formStatus = id => `<div class="status" id="${id}-st" role="alert" hidden></div>`;

function renderTix() {

  if (state.tix.step === 1) {
    root.innerHTML = `<div class="two"><div style="display:grid;gap:20px">

      <div class="sum" aria-live="polite">
        <div><span>${t?esc(t.name)+' × '+q:'No admission type chosen'}</span><span>${t?money(t.demoPrice*q):'—'}</span></div>

      <button class="btn btn-gold" id="tix-next" ${t?'':'disabled'}>Continue to demo checkout</button>
      <p class="small muted">${isPreview() ? 'No extras are preselected, and none are added at checkout.' : ''}</p></div>
      <div>${includedPanel(t)}</div></div>`;
    $$('input[name=tier]', root).forEach(r => r.addEventListener('change', () => { state.tix.tier = r.value; track('ticket_selected', { tier:r.value }); renderTix(); $('input[name=tier]:checked')?.focus(); }));
    const setQ = n => { state.tix.qty = Math.max(1, Math.min(10, n||1)); track('ticket_quantity_changed',{qty:state.tix.qty}); renderTix(); $('#qty')?.focus(); };
    $('#qm').onclick = () => setQ(q-1); $('#qp').onclick = () => setQ(q+1);
    $('#qty').addEventListener('change', e => setQ(parseInt(e.target.value,10)));
    $('#tix-next').onclick = () => { state.tix.step = 2; track('checkout_started_demo',{tier:t.id,qty:q}); renderTix(); $('#co-first')?.focus(); };

    root.innerHTML = `<div class="two"><form id="co-form" style="gap:18px">
      <div class="status"><strong>Demo checkout.</strong> No payment is collected and no card fields exist here. In production this step is a Stripe-hosted Checkout page.</div>

      ${check('co-mkt','Send me other news from the organizers. <span class="muted">Optional, unchecked by default.</span>')}
      <div class="sum"><div><span>${esc(t.name)} × ${q}</span><span>${money(total)}</span></div><div class="muted small"><span>Fees and taxes</span><span>None in demo</span></div>
        <div class="total"><span>Total you would pay</span><span>${money(total)}</span></div></div>
      ${formStatus('co-form')}
      <div class="row"><button class="btn btn-gold" type="submit">Complete demo checkout (no payment)</button>
        <button class="btn btn-line" type="button" id="co-leave">Leave checkout</button></div>
      <p class="privacy">Please don’t enter children’s names or details. Ticket holders’ names are collected only for adults in the household.</p></form>
      <div>${includedPanel(t)}</div></div>`;
    bindForm('co-form', { 'co-first':{req:true}, 'co-email':{req:true,email:true} }, d => {
      state.submitted.reader = { kind:'tickets', first:d['co-first'], tier:t.name, qty:q, total };

      state.tix = { tier:null, qty:1, step:1 };
      location.hash = 'confirm-reader';

  }

   ['Passport sketch','Functional (illustrative)','Stamps live only in this tab.'],
   ['Event-status switch (launch list / tickets)','Functional','Driven by CONFIG.status; the bar at the top is a preview control.'],
   ['Form validation and accessible errors','Functional','Client-side only.'],
   ['Saving registrations, applications, inquiries','Simulated','No server. Nothing is stored.'],
   ['Ticket totals','Simulated','Demo prices for layout testing only.'],
   ['Checkout and payment','Simulated','No Stripe connected. No payment fields exist.'],
   ['Confirmation emails and sequences','Copy drafts only','Nothing sent or scheduled.'],
   ['Analytics','Simulated','In-memory event log below. No pixels installed.'],
   ['Calendar tools','Disabled','Until dates are confirmed.']
  ];
  const missing = ['Festival date(s) and times','Venue, address, parking, and transit','Approved ticket types, prices, fees, and benefits','Exactly what Premium adds','Refund, change, and cancellation policies','Accessibility details','Photography policy','Age and child-supervision policy','Food and allergen information','Author package inclusions and pricing','Author acceptance criteria and response timeline','Sponsor package terms','Confirmed attractions and performers','Organizer bios and verified credentials','Contact email and phone','Privacy policy, terms, and consent language','Trademark / name availability check','Insurance and venue contract'];
  const prod = ['Server-side validation and storage for every form (Netlify Functions to Supabase)','Protected admin access (Supabase Auth, role-checked)','Row-level security so the attendee list is never publicly readable','Stripe-hosted Checkout created server-side, with the full total shown first','Verified, idempotent Stripe webhooks that mark orders paid','Server-side confirmation emails via Resend, only after storage succeeds','Separate, unchecked marketing-consent field with timestamp','Privacy policy, data retention schedule, and children’s-data review','No secret keys in browser code; environment variables only'];
  const meas = [
   ['Primary CTA clicks','cta_click','Which placement (hero, final, nav)'],['World exploration','world_opened','World id'],['Ticket selections','ticket_selected','Tier id, quantity'],['Completed registrations','registration_completed','Kind (launch list / tickets)'],['Author applications','author_application_completed','Preferred world'],['Sponsor inquiries','sponsor_inquiry_completed','Interest'],['Checkout abandonment','checkout_abandoned','Step left, tier']];
  return `<section class="s"><div class="wrap" style="display:grid;gap:56px;grid-template-columns:minmax(0,1fr)">
    <div class="sh" style="margin:0"><span class="eyebrow">Organizer notes</span><h1 id="k1" style="font-size:clamp(2.2rem,5vw,3.6rem)">Launch kit.</h1>
      <p class="lede">This is a working preview. It is not a deployed website, not production-ready, and not taking registrations.</p>
      <div class="row"><a class="btn btn-line btn-sm" href="#emails">Draft emails</a><a class="btn btn-line btn-sm" href="#confirm-reader">Reader confirmation</a><a class="btn btn-line btn-sm" href="#confirm-author">Author confirmation</a><a class="btn btn-line btn-sm" href="#confirm-sponsor">Sponsor confirmation</a></div></div>
    <div><h2 style="font-size:1.8rem;margin-bottom:16px">Functional vs. simulated</h2><div class="tbl"><table><thead><tr><th>Feature</th><th>Status</th><th>Note</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td><strong>${r[1]}</strong></td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="two"><div><h2 style="font-size:1.8rem;margin-bottom:16px">Missing launch information</h2><ul class="ck">${missing.map((m,i)=>`<li>${check('mk'+i,esc(m))}</li>`).join('')}</ul></div>
      <div><h2 style="font-size:1.8rem;margin-bottom:16px">Remaining production work</h2><ul class="ck">${prod.map(p=>`<li>${check_ic()}${p}</li>`).join('')}</ul>
      <p class="small muted" style="margin-top:14px">Stack stays Netlify, Supabase, Stripe, Resend. No replacement is needed.</p></div></div>
    <div><h2 style="font-size:1.8rem;margin-bottom:16px">Proposed measurement plan</h2><div class="tbl"><table><thead><tr><th>What to learn</th><th>Event</th><th>Detail</th></tr></thead><tbody>${meas.map(r=>`<tr><td>${r[0]}</td><td><code>${r[1]}</code></td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
      <p class="small muted" style="margin-top:12px">No tracking or advertising pixels are installed. Recommend first-party, server-side events; any ad pixel needs approval and consent. Below is the in-memory log from this preview session only.</p>
      <div class="cfg" id="evlog" style="margin-top:12px;max-height:200px"></div></div>
    <div><h2 style="font-size:1.8rem;margin-bottom:16px">Configuration</h2><p class="small muted" style="margin-bottom:10px">The single place to edit event facts. Lives at the top of the page script as <code>CONFIG</code>.</p><div class="cfg">${esc(JSON.stringify({...CONFIG, tickets:CONFIG.tickets.map(t=>({id:t.id,name:t.name,approved:t.approved,price:t.price}))}, null, 2))}</div></div>
    <div><h2 style="font-size:1.8rem;margin-bottom:16px">Accessibility and link checks</h2><ul class="ck">${['Skip link, landmarks, and one h1 per page','Visible focus on every control','Labeled form fields with inline errors and a live status','44px minimum tap targets','Reduced-motion respected','Light and dark themes with readable contrast','Keyboard-operable map, list, dialog, tabs, and FAQ','All internal routes resolve: home, visit, join, worlds, authors, authors-apply, sponsors, sponsors-inquire, confirm-reader, confirm-author, confirm-sponsor, emails, launch-kit'].map(p=>`<li>${check_ic()}${p}</li>`).join('')}</ul>
      <p class="small muted" style="margin-top:12px">Items above are design intent. A formal audit with assistive technology on real devices is still needed.</p></div>
  </div></section>`;

/* ============================================================
   DIALOG
   ============================================================ */
let lastOpener = null;
function openWorld(id, opener) {
  const w = worldById(id), dlg = $('#dlg'); lastOpener = opener;
  track('world_opened', { world:id });
  dlg.style.setProperty('--w', `var(${w.col})`);
  dlg.innerHTML = `<button class="dlg-x" type="button" aria-label="Close" data-close>×</button>
    <div class="dlg-top"><span class="dlg-ic">${ico(w.id)}</span><span class="eyebrow">${esc(w.pillar)}</span><h2 id="dlg-title" style="font-size:clamp(1.7rem,4vw,2.3rem)">${esc(w.name)}</h2><span class="tag todo">Proposed</span></div>
    <div class="dlg-body">
      <div><h4>What this world celebrates</h4><p>${esc(w.celebrates)}</p></div>
      <div><h4>Books you might discover</h4><ul>${w.books.map(b=>`<li>${b}</li>`).join('')}</ul></div>
      <div><h4>Proposed activities</h4><ul>${w.acts.map(b=>`<li>${b}</li>`).join('')}</ul></div>
      <div class="dlg-scene"><span class="tag" style="margin-bottom:8px">Illustrative scene</span><br>${esc(w.scene)}</div>
      <p class="small muted">Subject to production feasibility and confirmed programming.</p>
      <div class="row"><a class="btn btn-gold" href="#join" data-close>${CONFIG.status==='launch-list'?'Join the Launch List':'Get Tickets'}</a>
        <a class="btn btn-line" href="#authors-apply" data-pref="${w.id}" data-close>${esc(w.authorLine)}</a></div>
    </div>`;
  dlg.showModal();
}
document.addEventListener('click', e => {
  const dlg = $('#dlg');
  const a = e.target.closest('[data-close]');
  if (a && dlg.open) { if (a.dataset.pref) state.prefWorld = a.dataset.pref; dlg.close(); }
  if (e.target === dlg) dlg.close();
});
$('#dlg').addEventListener('close', () => { if (lastOpener && document.contains(lastOpener)) lastOpener.focus(); });

/* ============================================================
   ROUTER
   ============================================================ */
const ROUTES = {
  home:{ r:renderHome, title:'Kingdom Story Festival' },
  worlds:{ r:renderHome, scroll:'worlds-sec', title:'Explore the Worlds' },
  visit:{ r:renderVisit, title:'Plan Your Visit' },
  join:{ r:renderVisit, scroll:'tickets', title:'Join the Launch List' },
  authors:{ r:renderAuthors, title:'For Authors' },
  'authors-apply':{ r:renderAuthors, scroll:'apply', title:'Apply as an Author' },
  sponsors:{ r:renderSponsors, title:'For Sponsors' },
  'sponsors-inquire':{ r:renderSponsors, scroll:'inquire', title:'Sponsor Inquiry' },
  'confirm-reader':{ r:renderConfirmReader, title:'Confirmation' },
  'confirm-author':{ r:renderConfirmAuthor, title:'Application Confirmation' },
  'confirm-sponsor':{ r:renderConfirmSponsor, title:'Inquiry Confirmation' },
  emails:{ r:renderEmails, title:'Draft Emails' },
  'launch-kit':{ r:renderLaunchKit, title:'Launch Kit' }
};
const NAVMAP = { home:'', worlds:'worlds', visit:'visit', join:'visit', authors:'authors', 'authors-apply':'authors', sponsors:'sponsors', 'sponsors-inquire':'sponsors' };
let firstRender = true;
function route() {
  const key = (location.hash || '#home').slice(1);
  const def = ROUTES[key] || ROUTES.home, rk = ROUTES[key] ? key : 'home';
  $('#main').innerHTML = def.r();
  $('#nav-cta').textContent = ctaLabel();
  $('#nav').classList.remove('open'); $('#menu-btn').setAttribute('aria-expanded','false');
  $$('[data-nav]').forEach(a => { NAVMAP[rk] === a.dataset.nav ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'); });
  $$('[data-status]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.status === CONFIG.status)));
  document.title = (rk==='home' ? '' : def.title + ' · ') + 'Kingdom Story Festival';
  bindPage(rk);
  const target = def.scroll && $('#'+def.scroll);
  if (target) { target.scrollIntoView({ behavior: reduceMotion()?'auto':'smooth', block:'start' }); }
  else window.scrollTo(0,0);
  if (!firstRender) { announce(def.title); if (!target) $('#main').focus({ preventScroll:true }); }
  firstRender = false;
  track('page_view', { route:rk });
}
function bindPage(rk) {
  // world interactions
  $$('[data-world]').forEach(b => b.addEventListener('click', () => openWorld(b.dataset.world, b)));
  const mapWrap = $('#map-wrap'), cards = $('#cards-wrap');
  if (mapWrap) {
    const narrow = matchMedia('(max-width:720px)').matches;
    const setView = v => { mapWrap.hidden = v==='list'; cards.hidden = v==='map'; $$('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v))); state.mapView = v; };
    setView(narrow ? 'list' : (state.mapView || 'map'));
    $$('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
    if (narrow) { mapWrap.hidden = true; cards.hidden = false; }
    matchMedia('(max-width:720px)').onchange = ev => { if ($('#map-wrap')) setView(ev.matches ? 'list' : 'map'); };
  }
  $$('[data-stamp]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.stamp; state.stamps.has(id) ? state.stamps.delete(id) : state.stamps.add(id);
    $$('[data-stamp]').forEach(x => x.setAttribute('aria-pressed', String(state.stamps.has(x.dataset.stamp))));
    const n = state.stamps.size; $('#pass-msg').textContent = n===7 ? 'All 7 stamped. In the real passport, this is a story you took part in. Purchases never earn stamps.' : `${n} of 7 stamped. Purchases never earn stamps.`;
  }));
  $$('[data-stamp]').forEach(x => x.setAttribute('aria-pressed', String(state.stamps.has(x.dataset.stamp))));
  if (state.stamps.size) $('#pass-msg') && ($('#pass-msg').textContent = `${state.stamps.size} of 7 stamped. Purchases never earn stamps.`);
  $$('[data-cta]').forEach(a => a.addEventListener('click', () => track('cta_click', { where:a.dataset.cta })));
  bindLaunchList(); renderTix();
  if (rk==='authors' || rk==='authors-apply') bindAuthors();
  if (rk==='sponsors' || rk==='sponsors-inquire') bindSponsors();
  $$('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    const el = document.getElementById(b.dataset.copy), txt = el.innerText; const old = b.textContent;
    try { await navigator.clipboard.writeText(txt); b.textContent = 'Copied'; }
    catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Press Ctrl/Cmd+C to copy'; }
    setTimeout(() => b.textContent = old, 2000);
  }));
  $$('[data-tab]').forEach(t => {
    const sel = () => { $$('[data-tab]').forEach(x => { const on = x===t; x.setAttribute('aria-selected',String(on)); x.tabIndex = on?0:-1; document.getElementById('panel-'+x.dataset.tab).hidden = !on; }); };
    t.addEventListener('click', sel);
    t.addEventListener('keydown', e => { const tabs=$$('[data-tab]'), i=tabs.indexOf(t); if (e.key==='ArrowRight'||e.key==='ArrowLeft') { const n=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length]; n.focus(); n.click(); } });
  });
  const log = $('#evlog'); if (log) log.textContent = state.eventLog.length ? state.eventLog.map(e => `${e.t}  ${e.name}  ${JSON.stringify(e.props)}`).join('\n') : 'No events yet.';
  // footer
  renderFooter();
}
function renderFooter() {
  const l = CONFIG.links, lk = (u, t) => u ? `<a href="${esc(u)}">${t}</a>` : `<span>${t} <span class="tag todo">link needed</span></span>`;
  $('#footer').innerHTML = `<div class="wrap" style="display:grid;gap:22px"><div class="cols">
    <div><strong style="color:var(--ink)">${esc(CONFIG.name)}</strong><p>${esc(CONFIG.tagline)}</p><p>${esc(CONFIG.nameNote)}</p></div>
    <div><strong style="color:var(--ink)">Explore</strong><ul><li><a href="#worlds">The seven worlds</a></li><li><a href="#visit">Plan your visit</a></li><li><a href="#authors">For authors</a></li><li><a href="#sponsors">For sponsors</a></li></ul></div>
    <div><strong style="color:var(--ink)">Policies</strong><ul><li>${lk(l.privacy,'Privacy')}</li><li>${lk(l.terms,'Terms')}</li><li>${lk(l.refunds,'Refunds')}</li><li>${lk(l.accessibility,'Accessibility')}</li></ul></div>
    <div><strong style="color:var(--ink)">Organizer notes</strong><ul><li><a href="#launch-kit">Launch kit</a></li><li><a href="#emails">Draft emails</a></li></ul><p style="margin-top:8px">Contact: ${esc(CONFIG.contact.email)}</p></div></div>
    <div class="row" style="justify-content:space-between"><p class="small">A preview of a proposed event. Not a launched festival. Not affiliated with any theme park or technology brand.</p><button class="theme-btn" id="theme-btn" type="button">Toggle light / dark</button></div></div>`;
  $('#theme-btn').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme==='dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dark ? 'light' : 'dark'; };
}

/* ---------- global wiring ---------- */
addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  if (a.hasAttribute('data-skip')) { e.preventDefault(); $('#main').focus(); return; }
  if (a.getAttribute('href') === (location.hash || '#home')) { e.preventDefault(); route(); }
});
$('#menu-btn').addEventListener('click', () => { const n=$('#nav'); const o=n.classList.toggle('open'); $('#menu-btn').setAttribute('aria-expanded',String(o)); });
$$('[data-status]').forEach(b => b.addEventListener('click', () => { CONFIG.status = b.dataset.status; state.tix = {tier:null,qty:1,step:1}; track('status_changed_preview',{status:CONFIG.status}); route(); }));
addEventListener('keydown', e => { if (e.key==='Escape' && $('#nav').classList.contains('open')) { $('#nav').classList.remove('open'); $('#menu-btn').setAttribute('aria-expanded','false'); $('#menu-btn').focus(); } });
route();
</script>
