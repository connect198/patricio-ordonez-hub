[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/event"
  to = "/.netlify/functions/event-public"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify"
  to = "/.netlify/functions/guest-verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/assist"
  to = "/.netlify/functions/assist-request"
  status = 200
  force = true

[[redirects]]
  from = "/api/credentials/issue"
  to = "/.netlify/functions/credentials-issue"
  status = 200
  force = true

[[redirects]]
  from = "/api/credentials/resolve"
  to = "/.netlify/functions/credentials-resolve"
  status = 200
  force = true

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/server-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/import/stage"
  to = "/.netlify/functions/import-stage"
  status = 200
  force = true

[[redirects]]
  from = "/api/import/apply"
  to = "/.netlify/functions/import-apply"
  status = 200
  force = true

[[redirects]]
  from = "/api/team/invite"
  to = "/.netlify/functions/team-invite"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
